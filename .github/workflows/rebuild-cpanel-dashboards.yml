name: Rebuild cPanel sites and dashboards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-cpanel-dashboards.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [website-updated]

permissions:
  contents: write

concurrency:
  group: rebuild-cpanel-dashboards
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cPanel deployment repository
        uses: actions/checkout@v4
        with:
          path: cpanel
          token: ${{ github.token }}

      - name: Checkout Master Dashboard source
        uses: actions/checkout@v4
        with:
          repository: Shadyelsawy536/master-dashboard
          ref: main
          path: master-source

      - name: Checkout Restaurant Admin source
        uses: actions/checkout@v4
        with:
          repository: Shadyelsawy536/cafe-admin-dashboard
          ref: main
          path: admin-source

      - name: Checkout Customer Website source
        uses: actions/checkout@v4
        with:
          repository: Shadyelsawy536/cafe-website
          ref: main
          path: website-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            master-source/package-lock.json
            admin-source/package-lock.json

      # Build all three frontends from their current main branches.
      - name: Build Master Dashboard for cPanel root
        working-directory: master-source
        run: |
          npm ci
          npm run build -- --base=/

      - name: Build Restaurant Admin for cPanel root
        working-directory: admin-source
        run: |
          npm ci
          npm run build -- --base=/

      - name: Build Customer Website for cPanel
        id: website_build
        working-directory: website-source
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Website build skipped. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets to build the customer website."
            exit 0
          fi
          npm install
          npm run build
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Replace deployed static files
        shell: bash
        env:
          WEBSITE_READY: ${{ steps.website_build.outputs.ready }}
        run: |
          set -euo pipefail
          for target in cpanel/master cpanel/dashboard; do
            find "$target" -mindepth 1 -maxdepth 1 ! -name '.htaccess' -exec rm -rf {} +
          done
          cp -a master-source/dist/. cpanel/master/
          cp -a admin-source/dist/. cpanel/dashboard/

          if [ "$WEBSITE_READY" = "true" ]; then
            find cpanel/site -mindepth 1 -maxdepth 1 ! -name '.htaccess' -exec rm -rf {} +
            cp -a website-source/dist/. cpanel/site/
          else
            echo "Keeping existing cpanel/site files unchanged because website secrets are not configured."
          fi

      - name: Commit rebuilt cPanel assets
        working-directory: cpanel
        env:
          WEBSITE_READY: ${{ steps.website_build.outputs.ready }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master dashboard
          if [ "$WEBSITE_READY" = "true" ]; then
            git add site
          fi
          if git diff --cached --quiet; then
            echo "No generated site or dashboard changes to commit."
            exit 0
          fi
          git commit -m "Build optimized site and dashboards for cPanel"
          git push
