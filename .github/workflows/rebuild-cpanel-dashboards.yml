name: Rebuild cPanel dashboards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-cpanel-dashboards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-cpanel-dashboards
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cPanel deployment repository
        uses: actions/checkout@v4
        with:
          path: cpanel
          token: ${{ github.token }}

      - name: Checkout Master Dashboard source
        uses: actions/checkout@v4
        with:
          repository: Shadyelsawy536/master-dashboard
          ref: main
          path: master-source

      - name: Checkout Restaurant Admin source
        uses: actions/checkout@v4
        with:
          repository: Shadyelsawy536/cafe-admin-dashboard
          ref: main
          path: admin-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            master-source/package-lock.json
            admin-source/package-lock.json

      # Build from current main branches so cPanel always gets the latest validated page-splitting changes.
      - name: Build Master Dashboard for cPanel root
        working-directory: master-source
        run: |
          npm ci
          npm run build -- --base=/

      - name: Build Restaurant Admin for cPanel root
        working-directory: admin-source
        run: |
          npm ci
          npm run build -- --base=/

      - name: Replace deployed static files
        shell: bash
        run: |
          set -euo pipefail
          for target in cpanel/master cpanel/dashboard; do
            find "$target" -mindepth 1 -maxdepth 1 ! -name '.htaccess' -exec rm -rf {} +
          done
          cp -a master-source/dist/. cpanel/master/
          cp -a admin-source/dist/. cpanel/dashboard/

      - name: Commit rebuilt cPanel assets
        working-directory: cpanel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master dashboard
          if git diff --cached --quiet; then
            echo "No generated dashboard changes to commit."
            exit 0
          fi
          git commit -m "Build optimized dashboards for cPanel"
          git push
